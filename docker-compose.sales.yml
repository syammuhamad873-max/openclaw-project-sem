services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sales
      POSTGRES_USER: sales_app
      POSTGRES_PASSWORD: change-this-password
    volumes:
      - sales_postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_app -d sales"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://sales_app:change-this-password@postgres:5432/sales
      DATABASE_SSL: "false"
    ports:
      - "3000:3000"

volumes:
  sales_postgres_data:
